name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets and a read-only token, so the reviewer cannot authenticate,
    # comment, or label. Skipping shows as a neutral check, not a red X — this is
    # deliberate, not a broken job. On a `labeled` event, only the retry label re-runs
    # the review; every other label is a no-op for this job.
    #
    # (trivial comment tweak to force a second commit for manual Phase 4 verification)
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: review
        name: Run AI code review
        uses: ./.github/actions/ai-code-review
        with:
          # Intentionally blanked to exercise the composite action's token guard
          # for Phase 4 manual verification item 4.9 (forced-error path).
          claude-code-oauth-token: ""
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}

      - name: Label verdict — PASS
        if: steps.review.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label "ai-cr:passed"
          gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-cr:failed" || true

      - name: Label verdict — FAIL
        if: steps.review.outputs.verdict == 'FAIL'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label "ai-cr:failed"
          gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-cr:passed" || true

      # Re-adding a label that is already applied fires no `labeled` event, so this
      # removal must run even when the review step failed — otherwise a failed run
      # leaves `ai-cr:review` stuck and the PR becomes unretryable.
      - name: Remove retry label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-cr:review" || true
